# chrome-faithful DSH bundle layer.
#
# When this bundle is installed into a DSH profile (via
# `dsh plugin --profile <name> add github:bpc-oss/chrome-faithful` or a local
# checkout), this patch mounts the chrome-faithful MCP server through the
# official MCP client bridge, exposing its tools to the model as
# `mcp__chrome_faithful__*`.
#
# The server entry resolves through the package's own exports
# ("./mcp-server" -> src/mcp-server.mjs) relative to the profile install.
# The !!js expressions run in the DSH host's composition context
# (process.getBuiltinModule requires host Node >= 22.3).
- insert:
    - id: chrome-faithful-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chrome_faithful
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js >-
              process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('chrome-faithful/mcp-server')
        env: !!js >-
          Object.fromEntries(['AGENTOS_CHROME_CONFIG', 'AGENTOS_VERIFICATION_BACKEND'].flatMap((key) => typeof process.env[key] === 'string' ? [[key, process.env[key]]] : []))
        toolCallTimeoutMs: 60000
        failOnStartupError: true