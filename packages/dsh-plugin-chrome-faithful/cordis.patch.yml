- insert:
    - id: chrome-faithful-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chrome_faithful
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js >-
              process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@bpc-oss/dsh-plugin-chrome-faithful/mcp-server')
        env: !!js >-
          Object.fromEntries(['AGENTOS_CHROME_CONFIG', 'CHROME_FAITHFUL_OCR_BACKEND', 'CHROME_FAITHFUL_PYTHON', 'CHROME_FAITHFUL_PPOCR_DET_MODEL_DIR', 'CHROME_FAITHFUL_PPOCR_REC_MODEL_DIR', 'CHROME_FAITHFUL_VLM_BACKEND'].flatMap((key) => typeof process.env[key] === 'string' ? [[key, process.env[key]]] : []))
        toolCallTimeoutMs: 60000
        failOnStartupError: true
