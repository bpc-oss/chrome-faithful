name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:parity
      - run: npm test
      - run: npm run build:extension

  test-windows:
    name: Node + installer tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:parity
      - run: npm test
      - run: npm run build:extension
      - name: Installer transaction tests
        shell: pwsh
        run: pwsh -NoProfile -File test/installer-transactions.test.ps1
