name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/dsh-host-contract.test.mjs test/dsh-package-isolation.test.mjs
      - run: npm run check
      - run: npm run check:parity
      - run: npm run build:extension
      - run: git diff --exit-code -- extension/generated/
      - run: npm test

  test-windows:
    name: Node + installer tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/dsh-host-contract.test.mjs test/dsh-package-isolation.test.mjs
      - run: npm run check
      - run: npm run check:parity
      - run: npm run build:extension
      - run: git diff --exit-code -- extension/generated/
      - run: npm test
      - name: Installer transaction tests
        shell: pwsh
        run: pwsh -NoProfile -File test/installer-transactions.test.ps1
